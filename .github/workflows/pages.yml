name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Try to create the Pages site for this repository using the job's
      # own token. This is a no-op once Pages already exists.
      - name: Enable Pages
        id: enable
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -x
          for METHOD in POST PUT; do
            echo "--- attempt $METHOD /repos/$REPO/pages ---"
            curl -sS -o /tmp/pages.json -w 'HTTP %{http_code}\n' \
              -X $METHOD \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/pages" \
              -d '{"build_type":"workflow"}' || true
            cat /tmp/pages.json; echo
          done
          curl -sS -w '\nHTTP %{http_code}\n' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            index.html
            css
            js
            assets
            3d

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
