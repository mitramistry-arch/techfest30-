name: Enable GitHub Pages

# Tries to create the Pages site for this repository using the job's own
# token, so the static site can publish without a manual admin toggle in
# Settings → Pages → Source.
#
# The raw API responses are mirrored to the `pages-diagnostics` branch
# because job logs are only readable inside GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attempt to create the Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          {
            for METHOD in POST PUT; do
              echo "### $METHOD /repos/$REPO/pages"
              curl -sS -w '\nHTTP %{http_code}\n' \
                -X $METHOD \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/pages" \
                -d '{"build_type":"workflow"}'
              echo ""
            done
            echo "### GET /repos/$REPO/pages"
            curl -sS -w '\nHTTP %{http_code}\n' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/pages"
          } > pages-diag.txt 2>&1 || true
          cat pages-diag.txt

      - name: Publish the diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B pages-diagnostics
          git add pages-diag.txt
          git commit -m "chore: pages enablement diagnostics" || echo "nothing to commit"
          git push origin pages-diagnostics --force
